apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-api
  labels:
    app: heart-api
spec:
  replicas: 2                       # run 2 copies ("pods") of the API
  selector:
    matchLabels:
      app: heart-api
  template:
    metadata:
      labels:
        app: heart-api
    spec:
      containers:
        - name: heart-api
          image: heart-disease-api:1.0.0
          imagePullPolicy: IfNotPresent     # use the image we loaded into Minikube (do not pull from the internet)
          ports:
            - containerPort: 8000
          resources:                        # how much CPU / memory a pod may use
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:                   # "is the pod ready for traffic?"  (calls /health)
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:                    # "is the pod still alive?"  Kubernetes restarts it if not
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
