[flake8]
# flake8 = style checker. We allow longer lines (110) and skip folders that are not our code.
max-line-length = 110
exclude = .git,__pycache__,venv,mlruns,notebooks,docs

[tool:pytest]
# pytest finds tests in tests/ and can import "src" and "app" from the project root.
testpaths = tests
pythonpath = .
addopts = -v --tb=short
